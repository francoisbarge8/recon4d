[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recon4d"
version = "0.1.0"
description = "3D/4D reconstruction from monocular video: depth prediction, camera pose estimation and point tracking fused into (dynamic) Gaussian splats. Pure PyTorch, runs on CPU."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "francoisb12" }]
keywords = [
    "3d-reconstruction",
    "4d-reconstruction",
    "gaussian-splatting",
    "nerf",
    "structure-from-motion",
    "bundle-adjustment",
    "point-tracking",
    "monocular-depth",
    "pytorch",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "numpy>=1.24",
    "scipy>=1.10",
    "opencv-python>=4.8",
    "pillow>=9.5",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "typer>=0.9",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Learned perceptual metric (LPIPS). Downloads backbone weights on first use.
lpips = ["lpips>=0.1.4"]
# Pretrained monocular depth (Depth Anything V2) through Hugging Face transformers.
depth = ["transformers>=4.45"]
# COLMAP structure-from-motion as an alternative pose backend.
colmap = ["pycolmap>=3.10"]
dev = ["pytest>=7.4", "ruff>=0.5"]
all = ["recon4d[lpips,depth,colmap,dev]"]

[project.scripts]
recon4d = "recon4d.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running test (deselect with '-m \"not slow\"')",
    "network: needs to download pretrained weights",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY", "RUF"]
ignore = [
    "E741",   # single-letter names are the notation of the underlying math (I, O, l)
    "RUF002", # math symbols in docstrings
    "RUF003", # math symbols in comments
    "SIM108", # ternaries are not always clearer
]

[tool.ruff.lint.isort]
known-first-party = ["recon4d"]
